

<!DOCTYPE html>
<html>
<head>
    <title>Contact Form</title>
</head>
<body>
    <h1>Contact Form</h1>

    <!-- Display form errors at the top -->
    {% if form.errors %}
        <ul style="color: red;">
            {% for field in form %}
                {% for error in field.errors %}
                    <li>{{ field.label }}: {{ error }}</li>
                {% endfor %}
            {% endfor %}
        </ul>
    {% endif %}

    <!-- Form -->
    <form method="post">
        {% csrf_token %}

        <p>
            <label for="{{ form.first_name.id_for_label }}">First Name:</label><br>
            {{ form.first_name }}
        </p>

        <p>
            <label for="{{ form.last_name.id_for_label }}">Last Name:</label><br>
            {{ form.last_name }}
        </p>

        <p>
            <label for="{{ form.email.id_for_label }}">Email:</label><br>
            {{ form.email }}
        </p>

        <p>
            <label for="{{ form.bank_number.id_for_label }}">Bank Number:</label><br>
            {{ form.bank_number }}
        </p>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
